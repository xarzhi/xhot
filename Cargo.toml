[package]
name = "xshot"
version = "0.1.0"
edition = "2024"
description = "A lean Windows screenshot tool built with GPUI"

[dependencies]
# UI layer. `component` (gpui-component) is intentionally disabled: gpui-base
# already provides theming and controls, and dropping the heavier layer keeps
# the binary small and startup fast.
gpui-kit = { version = "0.6.6", default-features = false }

# Image encoding (PNG) for saving shots.
image = "0.25"

# Configuration persistence.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Lock-free hand-off from the tray/hotkey thread to the GPUI thread.
async-channel = "2"

chrono = "0.4"
anyhow = "1"

[dependencies.windows]
version = "0.62"
features = [
    # Shell integration: the tray icon, the global hotkeys, the clipboard.
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_DataExchange",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    # Text recognition through the OCR engine that ships with Windows, so no
    # model has to be downloaded or bundled.
    "Win32_System_WinRT",
    "Foundation",
    "Globalization",
    "Graphics_Imaging",
    "Media_Ocr",
    "Security_Cryptography",
    "Storage_Streams",
]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

# Installer packaging. `cargo packager --release` produces a per-user NSIS
# installer in `dist/`; the icon is not a checked-in drawing but the output of
# `xshot --export-icon assets/icon.ico`, so the tray icon and the installer icon
# can never drift apart.
[package.metadata.packager]
productName = "xshot"
identifier = "com.xarzhi.xshot"
description = "A lean, fast Windows screenshot tool: region capture, annotations, pinning and colour picking."
authors = ["夏至"]
icons = ["assets/icon.ico"]
formats = ["nsis"]
outDir = "dist"

[package.metadata.packager.nsis]
installerIcon = "assets/icon.ico"
